prebuild:
  name: Pre-build Briefing
  description: Builds and stores a routine's segments, or the segments of all of a person's routines, without playing anything. For visual routines the stitched routine video and an audio copy are stored too.
  fields:
    person:
      name: Person
      description: Person to pre-build for. Alone, builds the union of all of that person's routines; with a routine, picks which person's routine is meant.
      required: false
      example: Sam
      selector:
        text:
    routine:
      name: Routine
      description: Routine to pre-build. Give a person or a routine, or both.
      required: false
      example: Quick
      selector:
        text:

play:
  name: Play Briefing
  description: Plays a routine now from fresh stored segments, building anything missing or stale live first.
  fields:
    person:
      name: Person
      description: Person whose routine to play. Needed only when more than one person has a routine with this name.
      required: false
      example: Sam
      selector:
        text:
    routine:
      name: Routine
      description: Routine to play.
      required: true
      example: Quick
      selector:
        text:
    target:
      name: Target Media Player
      description: Plays on this media player instead of the person's output device.
      required: false
      example: media_player.kitchen_speaker
      selector:
        entity:
          domain: media_player
    skip_played:
      name: Skip Played Segments
      description: If true, plays only the segments this routine has not yet played in the person's briefing day. When everything has been heard, a short "That's everything" line plays.
      required: false
      default: false
      selector:
        boolean:
