prebuild:
  name: Pre-build Briefing
  description: Builds and stores a routine's segments, or the segments of all of a person's routines, without playing anything. For visual routines the stitched routine video and an audio copy are stored too.
  fields:
    person:
      name: Person
      description: Person to pre-build for. Alone, builds the union of all of that person's routines; with a routine, picks which person's routine is meant.
      required: false
      example: Sam
      selector:
        text:
    routine:
      name: Routine
      description: Routine to pre-build. Give a person or a routine, or both.
      required: false
      example: Quick
      selector:
        text:

refresh:
  name: Refresh Dynamic Segments
  description: Rebuilds only the weather and commute segments of a routine, or of all of a person's routines that have them, so they reflect this moment. Other segments are left as they are. A play started while a refresh runs waits up to 10 seconds for it, then plays the stored segments.
  fields:
    person:
      name: Person
      description: Person to refresh. Alone, refreshes every routine of that person that has a weather or commute segment; with a routine, picks which person's routine is meant.
      required: false
      example: Sam
      selector:
        text:
    routine:
      name: Routine
      description: Routine whose weather and commute segments to refresh. Give a person or a routine, or both.
      required: false
      example: Quick
      selector:
        text:
    segments:
      name: Segments
      description: "Optional. Only these dynamic segment types are refreshed, for example weather. Allowed: commute, weather. Without it, every dynamic type is refreshed. A routine's status sensor lists its dynamic segments in the dynamic_segments attribute."
      required: false
      example: weather
      selector:
        text:
          multiple: true

play:
  name: Play Briefing
  description: Plays a routine now from fresh stored segments, building anything missing or stale live first.
  fields:
    person:
      name: Person
      description: Person whose routine to play. Needed only when more than one person has a routine with this name.
      required: false
      example: Sam
      selector:
        text:
    routine:
      name: Routine
      description: Routine to play.
      required: true
      example: Quick
      selector:
        text:
    target:
      name: Target Media Player
      description: Plays on this media player instead of the person's output device.
      required: false
      example: media_player.kitchen_speaker
      selector:
        entity:
          domain: media_player
    skip_played:
      name: Skip Played Segments
      description: If true, plays only the segments this routine has not yet played in the person's briefing day. When everything has been heard, a short "That's everything" line plays.
      required: false
      default: false
      selector:
        boolean:
    volume:
      name: Volume
      description: Sets the player to this volume, from 0 to 1, before playing. Leave empty for the default level.
      required: false
      example: 0.5
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
          mode: slider

rebuild_announcement:
  name: Rebuild Announcement
  description: Builds an announcement again now. Creative wording gets new words, and visual announcements a new slide.
  fields:
    announcement:
      name: Announcement
      description: Name of the announcement to rebuild.
      required: true
      example: Freezer Door
      selector:
        text:

announce:
  name: Play Announcement
  description: Plays an announcement now, video on a screen and audio otherwise. A CastStudio briefing playing on the target pauses and resumes after it.
  fields:
    announcement:
      name: Announcement
      description: Name of the announcement to play.
      required: true
      example: Freezer Door
      selector:
        text:
    target:
      name: Target Media Player
      description: Media player to play the announcement on. Defaults to the announcement's Play on setting.
      required: false
      example: media_player.kitchen_speaker
      selector:
        entity:
          domain: media_player
