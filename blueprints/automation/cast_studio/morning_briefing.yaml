blueprint:
  name: CastStudio - Morning Briefing
  description: >-
    Silently pre-compiles multimedia briefing assets overnight and delivers an instant
    wake-up briefing with synchronized display visuals, dual-voice TTS narration, and concurrent
    smart home actions.
  domain: automation
  author: "Javan Dicks (@javand)"
  homeassistant:
    min_version: "2024.10.0"
  source_url: "https://github.com/javand/ha-cast-studio/blob/main/blueprints/automation/cast_studio/morning_briefing.yaml"
  input:
    pregenerate_time:
      name: Pre-generation Time
      description: Time to silently pre-compile the briefing video overnight.
      default: "04:30:00"
      selector:
        time: {}
    wake_trigger:
      name: Wake-up Trigger
      description: Trigger that initiates the morning briefing (e.g. alarm dismiss, bedroom motion, or morning button).
      selector:
        trigger: {}
    recipient_name:
      name: Recipient Name
      description: Real name to display visually on slides and cards.
      default: Javan
      selector:
        text: {}
    phonetic_name:
      name: Phonetic Name
      description: Phonetic pronunciation spelling strictly for spoken TTS narration.
      default: Jay-ven
      selector:
        text: {}
    target_player:
      name: Target Media Player
      description: Smart display or Google Cast media player entity for multimedia playback.
      selector:
        entity:
          domain: media_player
    greeting_image:
      name: Greeting Image Asset
      description: Image asset or avatar filename/path to display on the opening greeting slide.
      default: "welcome_avatar.png"
      selector:
        text: {}
    weather_entity:
      name: Weather Entity
      description: Weather entity to summarize in the forecast slide.
      default: ""
      selector:
        entity:
          domain: weather
    fun_fact_entity:
      name: Fun Fact Entity (Optional)
      description: Optional entity providing a morning fun fact, trivia, or national day.
      default: ""
      selector:
        entity:
          domain:
            - sensor
            - input_text
    calendar_entities:
      name: Calendar Entities
      description: Calendar entities to query and summarize in the agenda slide.
      default: []
      selector:
        entity:
          domain: calendar
          multiple: true
    todo_entity:
      name: Todo Entity (Optional)
      description: Task or to-do list entity to summarize in the morning briefing.
      default: ""
      selector:
        entity:
          domain: todo
    commute_sensor:
      name: Commute Sensor (Optional)
      description: Optional sensor entity providing traffic or transit commute status.
      default: ""
      selector:
        entity:
          domain: sensor
    scripture_sensor:
      name: Scripture Sensor (Optional)
      description: Sensor entity providing daily scripture or morning inspirational thought.
      default: ""
      selector:
        entity:
          domain: sensor
    host_voice:
      name: Host Voice
      description: High-fidelity voice for news, weather, and calendar slides.
      default: Pulcherrima
      selector:
        select:
          options:
            - Pulcherrima
            - Enceladus
    host_personality:
      name: Host Personality
      description: Speaking persona and cadence for the host speaker.
      default: news_anchor
      selector:
        select:
          options:
            - morning_host
            - news_anchor
            - upbeat_energetic
            - conversational
            - calm_reassuring
            - soothing
            - meditative
          custom_value: true
    scripture_voice:
      name: Scripture Voice
      description: High-fidelity voice for daily text and closing thoughts.
      default: Enceladus
      selector:
        select:
          options:
            - Enceladus
            - Pulcherrima
    scripture_personality:
      name: Scripture Personality
      description: Speaking persona and tone for daily scripture and reflection.
      default: life_coach
      selector:
        select:
          options:
            - life_coach
            - reverent
            - warm_uplifting
            - calm_reassuring
            - soothing
            - meditative
          custom_value: true
    conversation_agent:
      name: Conversation Agent (Optional)
      description: Specific Home Assistant conversation agent entity for AI script generation.
      default: ""
      selector:
        conversation_agent: {}
    background_actions:
      name: Background Actions
      description: Smart home actions executed concurrently on wake-up (e.g. coffee machine, kitchen lights).
      default: []
      selector:
        action: {}
    post_briefing_actions:
      name: Post-Briefing Actions
      description: Actions executed upon video completion (e.g. cast.show_lovelace_view to switch Nest Hub to morning dashboard).
      default: []
      selector:
        action: {}

mode: single
max_exceeded: silent

variables:
  recipient_name: !input recipient_name

trigger:
  - trigger: time
    at: !input pregenerate_time
    id: pregenerate
  - triggers: !input wake_trigger

action:
  - choose:
      - conditions:
          - condition: trigger
            id: pregenerate
        sequence:
          - action: cast_studio.pregenerate_routine
            data:
              routine_name: morning_briefing
              target_player: !input target_player
              recipient:
                name: !input recipient_name
                phonetic_name: !input phonetic_name
              routine_config:
                visuals: true
                conversation_agent: !input conversation_agent
                post_briefing_actions: !input post_briefing_actions
                steps:
                  - name: greeting
                    visual: true
                    title: !input recipient_name
                    subtitle: "Good Morning"
                    layout: "icon"
                    icon: !input greeting_image
                    voice: !input host_voice
                    voice_personality: !input host_personality
                    context: "A cheerful, energizing morning greeting for {{ recipient_name }}."
                  - name: weather
                    visual: true
                    entity_id: !input weather_entity
                    voice: !input host_voice
                    voice_personality: !input host_personality
                  - name: fun_fact
                    visual: true
                    entity_id: !input fun_fact_entity
                    voice: !input host_voice
                    voice_personality: !input host_personality
                  - name: calendar
                    visual: true
                    entity_ids: !input calendar_entities
                    voice: !input host_voice
                    voice_personality: !input host_personality
                  - name: todo
                    visual: true
                    entity_id: !input todo_entity
                    voice: !input host_voice
                    voice_personality: !input host_personality
                  - name: commute
                    visual: true
                    entity_id: !input commute_sensor
                    voice: !input host_voice
                    voice_personality: !input host_personality
                  - name: scripture
                    visual: true
                    entity_id: !input scripture_sensor
                    voice: !input scripture_voice
                    voice_personality: !input scripture_personality
    default:
      - action: cast_studio.run_routine
        data:
          routine_name: morning_briefing
          target_player: !input target_player
          post_routine_actions: !input post_briefing_actions
          recipient:
            name: !input recipient_name
            phonetic_name: !input phonetic_name
          routine_config:
            visuals: true
            conversation_agent: !input conversation_agent
            background_actions: !input background_actions
            post_briefing_actions: !input post_briefing_actions
            steps:
              - name: greeting
                visual: true
                title: !input recipient_name
                subtitle: "Good Morning"
                layout: "icon"
                icon: !input greeting_image
                voice: !input host_voice
                voice_personality: !input host_personality
                context: "A cheerful, energizing morning greeting for {{ recipient_name }}."
              - name: weather
                visual: true
                entity_id: !input weather_entity
                voice: !input host_voice
                voice_personality: !input host_personality
              - name: fun_fact
                visual: true
                entity_id: !input fun_fact_entity
                voice: !input host_voice
                voice_personality: !input host_personality
              - name: calendar
                visual: true
                entity_ids: !input calendar_entities
                voice: !input host_voice
                voice_personality: !input host_personality
              - name: todo
                visual: true
                entity_id: !input todo_entity
                voice: !input host_voice
                voice_personality: !input host_personality
              - name: commute
                visual: true
                entity_id: !input commute_sensor
                voice: !input host_voice
                voice_personality: !input host_personality
              - name: scripture
                visual: true
                entity_id: !input scripture_sensor
                voice: !input scripture_voice
                voice_personality: !input scripture_personality
