blueprint:
  name: CastStudio - Welcome Home Routine
  description: >-
    Welcomes family members upon arrival with personalized greeting slide, personal photo/avatar, and spoken greeting on smart displays.
  domain: automation
  author: "Javan Dicks (@javand)"
  homeassistant:
    min_version: "2024.10.0"
  source_url: "https://github.com/javand/ha-cast-studio/blob/main/blueprints/automation/cast_studio/welcome_home.yaml"
  input:
    arrival_trigger:
      name: Arrival Trigger
      description: Trigger that initiates the welcome greeting (e.g. person state changes to home, entry door sensor opens).
      selector:
        trigger: {}
    recipient_name:
      name: Recipient Name
      description: Real name of returning person to display visually on greeting card.
      default: Javan
      selector:
        text: {}
    phonetic_name:
      name: Phonetic Name
      description: Phonetic pronunciation spelling strictly for spoken TTS narration.
      default: Jay-ven
      selector:
        text: {}
    target_player:
      name: Target Media Player
      description: Living room or entry smart display entity for multimedia playback.
      selector:
        entity:
          domain: media_player
    avatar_image:
      name: Avatar Image
      description: Profile photo or avatar image filename stored in CastStudio media directory.
      default: welcome_avatar.png
      selector:
        text: {}
    welcome_voice:
      name: Welcome Voice
      description: High-fidelity voice model for the welcome greeting.
      default: Pulcherrima
      selector:
        select:
          options:
            - Pulcherrima
            - Enceladus
    welcome_personality:
      name: Welcome Personality
      description: Speaking persona and tone for the welcome arrival greeting.
      default: life_coach
      selector:
        text: {}
    welcome_actions:
      name: Welcome Actions
      description: Smart home actions executed concurrently on arrival (e.g. turn on entryway lights, adjust climate).
      default: []
      selector:
        action: {}

mode: single
max_exceeded: silent

trigger:
  - triggers: !input arrival_trigger

action:
  - action: cast_studio.run_routine
    data:
      routine_name: welcome_home
      target_player: !input target_player
      recipient:
        name: !input recipient_name
        phonetic_name: !input phonetic_name
      routine_config:
        visuals: true
        steps:
          - name: greeting
            visual: true
            title: !input recipient_name
            subtitle: "Welcome Home"
            image_path: !input avatar_image
            layout: "icon"
            voice: !input welcome_voice
            voice_personality: !input welcome_personality
            context: "Warm, welcoming arrival message for {{ recipient_name }}."
    background_actions: !input welcome_actions
