blueprint:
  name: CastStudio - Reusable Event Alert
  description: >-
    Dispatches a reusable, zero-latency visual alert clip (e.g. freezer door left open, leak detected, gate open) with static or custom graphics and synthesized speech.
  domain: automation
  author: "Javan Dicks (@javand)"
  homeassistant:
    min_version: "2024.10.0"
  source_url: "https://github.com/javand/ha-cast-studio/blob/main/blueprints/automation/cast_studio/event_alert.yaml"
  input:
    alert_trigger:
      name: Alert Trigger
      description: Trigger that initiates the visual alert (e.g. freezer door left open for 60s, leak sensor wet).
      selector:
        trigger: {}
    clip_name:
      name: Clip Name
      description: Unique identifier for the reusable alert clip.
      default: freezer_alert
      selector:
        text: {}
    target_player:
      name: Target Media Player
      description: Smart display or Google Cast media player entity for multimedia playback.
      selector:
        target:
          entity:
            domain: media_player
    alert_title:
      name: Alert Title
      description: Headline text displayed prominently on screen.
      default: Freezer Door Open!
      selector:
        text: {}
    alert_message:
      name: Alert Message
      description: Spoken narration and descriptive message synthesized by CastStudio.
      default: "Attention: The kitchen freezer door has been left open."
      selector:
        text: {}
    image_asset:
      name: Image Asset
      description: Static image filename or icon asset to display on screen.
      default: dripping_ice.png
      selector:
        text: {}
    alert_voice:
      name: Alert Voice
      description: High-fidelity voice model for the spoken alert.
      default: Pulcherrima
      selector:
        select:
          options:
            - Pulcherrima
            - Enceladus
    alert_personality:
      name: Alert Personality
      description: Persona and vocal inflection for the synthesized alert.
      default: news_anchor
      selector:
        select:
          custom_value: true
          options:
            - news_anchor
            - life_coach
            - calm_reassuring
    background_actions:
      name: Background Actions
      description: Optional actions executed concurrently with the alert (e.g. flash kitchen lights, chime doorbell).
      default: []
      selector:
        action: {}

mode: restart

trigger:
  - triggers: !input alert_trigger

action:
  - action: cast_studio.run_routine
    data:
      routine_name: !input clip_name
      target_player: !input target_player
      routine_config:
        static: true
        title: !input alert_title
        message: !input alert_message
        image_path: !input image_asset
        voice: !input alert_voice
        voice_personality: !input alert_personality
        actions: !input background_actions
        background_actions: !input background_actions
