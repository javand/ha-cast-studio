name: Automated Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"

permissions:
  contents: write

jobs:
  release:
    name: Automated Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (v4)
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read manifest version
        id: tag_version
        run: |
          # The manifest is the version Home Assistant shows, so it names the
          # release. Bump it in the PR; a merge without a bump releases nothing.
          version="$(jq -r .version custom_components/cast_studio/manifest.json)"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "v${version} already released; nothing to do."
          else
            echo "new_tag=v${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.tag_version.outputs.new_tag
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
